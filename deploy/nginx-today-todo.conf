# 部署到 /etc/nginx/conf.d/today-todo.conf 前，替换以下占位符：
#   <YOUR_DOMAIN>            已备案域名，如 todo.example.com
#   <YOUR_CERT_PATH>         证书文件，如 /etc/nginx/certs/todo.example.com.crt
#   <YOUR_CERT_KEY_PATH>     私钥文件，如 /etc/nginx/certs/todo.example.com.key

server {
    listen 80;
    server_name <YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <YOUR_DOMAIN>;

    ssl_certificate     <YOUR_CERT_PATH>;
    ssl_certificate_key <YOUR_CERT_KEY_PATH>;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
